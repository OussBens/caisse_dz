name: caisse_dz
description: "Application de gestion de caisse desktop pour Windows."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter


  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  bitsdojo_window: ^0.1.6

  # Local Storage
  shared_preferences: ^2.2.2
  mime: ^1.0.4
  llama_cpp_dart: ^0.1.0
  excel: ^4.0.0
  image: ^4.1.3
  camera: ^0.10.5
  http: ^1.1.0
  dio: ^5.3.0
  image_picker: ^1.0.4
  google_mlkit_text_recognition: ^0.13.1
  tesseract: ^0.0.8
  intl_utils: ^2.8.7
  uuid: ^4.4.0
  string_similarity: ^2.0.0
  collection: ^1.18.0
  file_picker: ^6.1.1
  photo_view: ^0.14.0
  flutter_image_compress: ^2.1.0
  open_file: ^3.3.2
  share_plus: ^7.2.1
  pdf: ^3.10.8
  printing: ^5.12.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  path_provider: ^2.1.2
  print_bluetooth_thermal: ^1.1.6

  # INTERNATIONALIZATION & LOCALIZATION
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # STATE MANAGEMENT
  provider: ^6.1.2
  flutter_bloc: ^8.1.3

  # ROUTING
  go_router: ^14.2.7
  archive: ^3.4.0

  # DATABASE & STORAGE - WINDOWS DESKTOP COMPATIBLE
  sqflite_common_ffi: ^2.3.7
  path: ^1.9.0

  # UI COMPONENTS
  syncfusion_flutter_datagrid: ^25.1.38
  syncfusion_flutter_core: ^25.1.35
  dropdown_button2: ^2.3.9
  cupertino_icons: ^1.0.8
  data_table_2: ^2.4.0
  fl_chart: ^0.66.0

  # UTILITIES
  csv: ^5.0.2
  win32: ^5.5.0
  ffi: ^2.1.0
  device_info_plus: ^12.0.0

dependency_overrides:
  archive: ^3.6.1
  image: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/icons/action/
    - assets/icons/sidebar/
    - assets/icons/cardwidget/
    - assets/images/
    - assets/sounds/
    - assets/translations/
    - assets/fonts/
    - assets/libs/sqlite3.dll

  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
        - asset: assets/fonts/NunitoSans-Bold.ttf
          weight: 700

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300

    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700